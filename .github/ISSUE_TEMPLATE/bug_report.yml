name: Bug report
description: Something in QuickPass isn't working
labels: [bug]
body:
  - type: input
    id: macos
    attributes:
      label: macOS version
      description: Apple menu › About This Mac
      placeholder: "26.1"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: QuickPass version
      description: Shown in QuickPass Settings, under Updates
      placeholder: "0.1.0"
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: more
    attributes:
      label: Anything else
      description: Screenshots help. Please leave out passwords, usernames and codes.
